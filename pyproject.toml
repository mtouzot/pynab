[project]
name = "pynab"
version = "1.0.2"
description = "Pynab project, Nabaztag en Python pour Raspberry Pi"
requires-python = "==3.9.*"

dependencies = [
# Django stack
"Django==4.2.30",
"gunicorn==22.0.0",
"lockfile==0.12.2",
"psycopg2-binary==2.9.3",

# APIs / misc
"Mastodon.py==1.5.1",
"meteofrance-api==1.3.0",
"requests==2.32.5",
"tqdm==4.66.3",
"mpg123==0.4",
"smbus2==0.4.1",
"ndef==0.2",

# Raspberry Pi hardware
"pyalsaaudio==0.9.0",
"rpi-ws281x==4.3.3",
"RPi.GPIO==0.7.1",

# Scientific / ML legacy stack (snips-compatible)
"numpy==1.21.4",
"scipy==1.6.2",
"scikit-learn==0.24.2",
"Cython==0.29.30",
"python-crfsuite==0.9.7",
"sklearn-crfsuite==0.3.6",

# Snips ecosystem (ARM wheels only)
"snips-nlu @ https://github.com/pguyot/snips-nlu/releases/download/0.20.2.1/snips_nlu-0.20.2.1-py3-none-any.whl",
"snips-nlu-parsers @ https://github.com/pguyot/snips-nlu-parsers/releases/download/v0.4.3/snips_nlu_parsers-0.4.3-cp39-cp39-linux_armv6l.whl ; platform_machine == 'armv6l'",
"snips-nlu-parsers @ https://github.com/pguyot/snips-nlu-parsers/releases/download/v0.4.3/snips_nlu_parsers-0.4.3-cp39-cp39-linux_armv7l.whl ; platform_machine == 'armv7l'",
"snips-nlu-parsers @ https://github.com/pguyot/snips-nlu-parsers/releases/download/v0.4.3/snips_nlu_parsers-0.4.3-cp39-cp39-linux_aarch64.whl ; platform_machine == 'aarch64'",

"snips-nlu-utils @ https://github.com/pguyot/snips-nlu-utils/releases/download/v0.9.1/snips_nlu_utils-0.9.1-cp39-cp39-linux_armv6l.whl ; platform_machine == 'armv6l'",
"snips-nlu-utils @ https://github.com/pguyot/snips-nlu-utils/releases/download/v0.9.1/snips_nlu_utils-0.9.1-cp39-cp39-linux_armv7l.whl ; platform_machine == 'armv7l'",
"snips-nlu-utils @ https://github.com/pguyot/snips-nlu-utils/releases/download/v0.9.1/snips_nlu_utils-0.9.1-cp39-cp39-linux_aarch64.whl ; platform_machine == 'aarch64'",

"py-kaldi-asr @ https://github.com/pguyot/py-kaldi-asr/releases/download/v0.5.3/py_kaldi_asr-0.5.3-cp39-cp39-linux_armv6l.whl ; platform_machine == 'armv6l'",
"py-kaldi-asr @ https://github.com/pguyot/py-kaldi-asr/releases/download/v0.5.3/py_kaldi_asr-0.5.3-cp39-cp39-linux_armv7l.whl ; platform_machine == 'armv7l'",
"py-kaldi-asr @ https://github.com/pguyot/py-kaldi-asr/releases/download/v0.5.3/py_kaldi_asr-0.5.3-cp39-cp39-linux_aarch64.whl ; platform_machine == 'aarch64'",
]

[project.optional-dependencies]
dev = [
"pytest==8.4.2",
"pytest-django==3.8.0",
"coverage==6.3.2",
"black==25.11.0",
"flake8==4.0.1",
"isort==5.10.1",
"pre-commit==2.17.0",
"mypy==0.950",
]

[build-system]
requires = ["setuptools>=65", "wheel", "Cython"]
build-backend = "setuptools.build_meta"

[tool.uv]
no-build-isolation = true
compile-bytecode = true
cache-keys = ["pyproject.toml"]
build-constraint-dependencies = [
    "setuptools>=65",
    "wheel",
    "Cython"
]

[tool.uv.pip]
only-binary = [
  "snips-nlu-parsers",
  "snips-nlu-utils",
  "py-kaldi-asr"
]

[tool.uv.extra-build-dependencies]
mpg123 = ["setuptools", "wheel"]
pyalsaaudio = ["setuptools"]
python-crfsuite = ["setuptools", "cython"]
sklearn-crfsuite = ["setuptools"]
scikit-learn = ["setuptools"]
scipy = ["setuptools", "wheel", "cython"]
numpy = ["setuptools", "wheel"]

[tool.setuptools]
zip-safe = false

packages = [
    "asr",
    "nabd",
    "nabweb",
    "nabboot",
    "nabbookd",
    "nabradio",
    "nabclockd",
    "nab8balld",
    "nabiftttd",
    "nabcommon",
    "nabwebhook",
    "nabtaichid",
    "nabweatherd",
    "nabsurprised",
    "nabmastodond",
    "nabairqualityd"
]


[tool.black]
line-length = 79

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = [
    "migrations"
]
namespace_packages = true

[tool.django-stubs]
django_settings_module = "nabweb.settings"
